# Verificacion del despliegue: construye la MISMA imagen que produccion y la
# levanta contra una base real, sin el proxy TLS (que necesita un dominio de
# verdad). Sirve para comprobar que la imagen construye, migra y responde.
#
#   docker compose -f docker-compose.verificar.yml up -d --build
#   curl http://127.0.0.1:8099/api/health/
#   docker compose -f docker-compose.verificar.yml down -v

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boliche_sig
      POSTGRES_USER: boliche
      POSTGRES_PASSWORD: verificacion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boliche -d boliche_sig"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: clave-solo-para-verificacion
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      # Sin proxy delante no hay TLS: la redireccion a HTTPS hay que apagarla o
      # el healthcheck en HTTP nunca responde.
      DJANGO_SECURE_SSL_REDIRECT: "False"
      POSTGRES_DB: boliche_sig
      POSTGRES_USER: boliche
      POSTGRES_PASSWORD: verificacion
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8099:8000"