services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boliche_sig}
      POSTGRES_USER: ${POSTGRES_USER:-boliche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boliche}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boliche} -d ${POSTGRES_DB:-boliche_sig}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
